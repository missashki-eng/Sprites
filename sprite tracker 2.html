<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sprite Checklist">
  <title>Fortnite Sprite Checklist</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:linear-gradient(160deg,#2d1b2e 0%,#3d1a35 40%,#1e1230 100%);min-height:100vh;font-family:-apple-system,system-ui,sans-serif;color:#fff;padding-bottom:60px}
    #app{max-width:480px;margin:0 auto;position:relative}
    button{font-family:inherit}
    #hdr{background:#1e0a22;border-bottom:2px solid rgba(244,143,177,.33);padding:14px 16px 10px;position:sticky;top:0;z-index:20;max-width:480px;margin:0 auto}
    #hdr h1{text-align:center;font-size:10px;letter-spacing:4px;color:#F48FB1;text-transform:uppercase;margin-bottom:2px}
    #hdr h2{text-align:center;font-size:20px;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#F48FB1,#CE93D8,#F06292);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    #stats{display:flex;justify-content:center;gap:16px;font-size:12px;margin-top:6px}
    #pb{background:rgba(255,255,255,.1);border-radius:10px;height:6px;margin:8px auto 0;max-width:280px}
    #pf{height:100%;border-radius:10px;background:linear-gradient(90deg,#F48FB1,#CE93D8,#F06292);transition:width .3s;width:0%}
    .fr{display:flex;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:2px;justify-content:center}
    .fb{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;flex-shrink:0;border:1.5px solid rgba(255,255,255,.15);background:transparent;color:#888;cursor:pointer;white-space:nowrap}
    #content{padding:16px 12px 0}
    .rh{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px}
    .rl{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
    .ss{margin-bottom:20px}
    .sn{font-size:13px;font-weight:700;margin-bottom:6px;padding-left:2px}
    .sa{font-size:10px;color:#888;font-weight:400;margin-left:8px}
    .vg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .vc{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:12px;padding:5px 3px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:border-color .15s;height:115px;justify-content:flex-start;overflow:hidden}
    .vc img{width:56px;height:56px;object-fit:contain;display:block}
    .vl{font-size:9px;font-weight:700;line-height:1}
    .ck{position:absolute;top:4px;right:5px;color:#F48FB1;font-size:13px;font-weight:900;display:none}
    .ls{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;outline:none;cursor:pointer;background:rgba(255,255,255,.15)}
    .lv{font-size:9px;font-weight:800;text-align:center;margin-top:2px}
    #dust-section{padding:12px 12px 0}
    #dust-box{background:rgba(255,255,255,.04);border:1.5px solid rgba(244,143,177,.3);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px}
    #dust-icon{font-size:20px;line-height:1}
    #dust-label{font-size:11px;font-weight:800;letter-spacing:2px;color:#F48FB1;text-transform:uppercase;flex:1}
    #dust-input-wrap{display:flex;align-items:center;gap:6px}
    #dust-input{background:rgba(244,143,177,.15);border:1.5px solid rgba(244,143,177,.4);border-radius:10px;color:#fff;font-size:18px;font-weight:800;padding:4px 10px;width:130px;text-align:right;-webkit-appearance:none;outline:none}
    #dust-input::placeholder{color:rgba(255,255,255,.3)}
    .bpw{display:flex;justify-content:center}
    .bpw .vc{width:calc(25% - 5px)}
    .ls::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:var(--thumb-color,#F48FB1);cursor:pointer}
    .lr{width:100%;margin-top:4px;padding:0 2px;display:flex;flex-direction:column;gap:2px}
    .ls{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;cursor:pointer;display:block}
    .ls::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:var(--thumb-color,#F48FB1);cursor:pointer}
    .lv{font-size:9px;font-weight:800;text-align:center;margin-top:1px}
  </style>
</head>
<body>
<div id="app">
<div id="hdr">
  <h1>Fortnite Ch.7 S3</h1>
  <h2>Sprite Checklist &#10024;</h2>
  <div id="stats">
    <span style="color:#F48FB1">&#10003; <span id="fc">0</span> found</span>

  <div id="search-wrap" style="padding:10px 40px 2px">

  <div class="fr" id="vf"></div>
  <div id="vbonus" style="display:none;text-align:center;font-size:10px;color:rgba(255,255,255,.55);padding:4px 12px 0;line-height:1.3;"></div>
  <div class="fr" id="sf"></div>
</div>
<div id="content"></div>
<div id="ra"></div>
</div>

var SPRITES_BASE=[
  { id: "water",       name: "Water Sprite",     rarity: "Rare",      color: "#4FC3F7", ability: "Replenish shield while in water for you and your nearby Squad!",                                        drop: "8.88%" },
  { id: "fire",        name: "Fire Sprite",       rarity: "Rare",      color: "#FF5722", ability: "Creates a fiery burst when you deal enough damage to an enemy!",                         drop: "8.88%" },
  { id: "earth",       name: "Earth Sprite",      rarity: "Rare",      color: "#8D6E63", ability: "You have a chance to find additional rare items when opening chests",                 drop: "8.88%" },
  { id: "duck",        name: "Duck Sprite",        rarity: "Epic",      color: "#FFD54F", ability: "Emoting or Jamming replenishes shields",                              drop: "4.04%"  },
  { id: "ghost",       name: "Ghost Sprite",       rarity: "Epic",      color: "#B0BEC5", ability: "Grants cloak for a duration upon reloading",                   drop: "4.04%"  },
  { id: "demon",       name: "Demon Sprite",       rarity: "Epic",      color: "#EF5350", ability: "Siphon some health and shields when you eliminate an opponent",                drop: "4.06%" },
  { id: "king",        name: "King Sprite",        rarity: "Epic",      color: "#FFD700", ability: "Your Pickaxe deals more damage",                                            drop: "4.04%"  },
  { id: "dream",       name: "Dream Sprite",       rarity: "Legendary", color: "#CE93D8", ability: "Grants a random item at each level, exploding with legendary loot at Max Level",  drop: "1.85%" },
  { id: "punk",        name: "Punk Sprite",        rarity: "Legendary", color: "#FF8A65", ability: "Possibly nothing... or infinitely something",              drop: "1.39%" },
  { id: "zeropoint",   name: "Zero Point Sprite",  rarity: "Mythic",    color: "#00E5FF", ability: "Spawn a Shield Bubble Jr. when you use a healing item on yourself (excluding splashes and grenades)",          drop: "0.000069%" },
  { id: "burntpeanut", name: "The Burnt Peanut",   rarity: "Mythic",    color: "#FF6D00", ability: "Goop! When eliminating players, you may find more loot. Sometimes mythic!", noVariants: true, drop: "1.01%" },

var VARIANTS=[
  { key: "base",   label: "Base",   icon: "\u2B21", color: "#f9c8e0", bonus: "Standard ability, no bonus.",               drop: {water:"8.88%", fire:"8.88%", earth:"8.88%", duck:"4.04%", ghost:"4.04%", demon:"4.06%", king:"4.04%", dream:"1.85%", punk:"1.39%", zeropoint:"0.000069%", fishy:"13.79%", striker:"5.74%", aura:"5.74%", boss:"2.63%", grim:"0.000098%"} },
  { key: "gold",   label: "Gold",   icon: "\u2605", color: "#FFD700", bonus: "+XP per elimination.",                      drop: {water:"0.7%", fire:"0.7%", earth:"0.7%", duck:"0.05%", ghost:"0.05%", demon:"0.05%", king:"0.05%", dream:"0.02%", punk:"0.02%", zeropoint:"0.0000008%", fishy:"0.17%", striker:"0.07%", aura:"0.07%", boss:"0.03%", grim:"0.0000012%"} },
  { key: "gummy",  label: "Gummy",  icon: "\u273F", color: "#F48FB1", bonus: "Gain 10% more Sprite Dust upon Extraction",           drop: {water:"4.23%", fire:"4.23%", earth:"4.23%", duck:"1.76%", ghost:"1.76%", demon:"1.76%", king:"1.76%", dream:"0.81%", punk:"0.61%", zeropoint:"0.00003%", fishy:"0.08%", striker:"0.04%", aura:"0.04%", boss:"0.02%", grim:"0.0000006%"} },
  { key: "galaxy", label: "Galaxy", icon: "\u2726", color: "#CE93D8", bonus: "Gain 20% more Ammo whenever picked up in the world",            drop: {water:"0.28%", fire:"0.28%", earth:"0.28%", duck:"0.02%", ghost:"0.02%", demon:"0.000001%", king:"0.02%", dream:"0.01%", punk:"0.004%", zeropoint:"0.0000003%", fishy:"0.06%", striker:"0.02%", aura:"0.02%", boss:"0.01%", grim:"0.0000004%"} },
];
var ALL_SPRITES=[];
for(var _i=0;_i<SPRITES_BASE.length;_i++){
  var _s=SPRITES_BASE[_i];
  if(_s.noVariants){
    ALL_SPRITES.push({uid:_s.id+"_only",spriteId:_s.id,variantKey:"base",variantLabel:null,variantIcon:null,variantColor:null,id:_s.id,name:_s.name,rarity:_s.rarity,color:_s.color,ability:_s.ability,noVariants:true,drop:_s.drop});
  } else {
    for(var _j=0;_j<VARIANTS.length;_j++){
      var _v=VARIANTS[_j];
      var _drop=_v.drop&&_v.drop[_s.id]!=null?_v.drop[_s.id]:"?";
      ALL_SPRITES.push({uid:_s.id+"_"+_v.key,spriteId:_s.id,variantKey:_v.key,variantLabel:_v.label,variantIcon:_v.icon,variantColor:_v.color,id:_s.id,name:_s.name,rarity:_s.rarity,color:_s.color,ability:_s.ability,drop:_drop,bonus:_v.bonus});
    }
  }
}
var SK="fortnite-sprite-checklist-v4";
function sg(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var checkedArr=sg(SK,[]);
if(!Array.isArray(checkedArr)){checkedArr=[];}
var checkedSet={};
for(var _ci=0;_ci<checkedArr.length;_ci++){checkedSet[checkedArr[_ci]]=true;}
var levels=sg(SK+"-levels",{});
if(!levels||typeof levels!=="object"||Array.isArray(levels)){levels={};}
var rarityFilter="All";
var variantFilter="All";
var showUnchecked=false;
var showNotMax=false;
var showOwned=false;
var showMastered=false;
var searchQuery="";
function isChecked(uid){return !!checkedSet[uid];}
function toggleCheck(uid){if(checkedSet[uid]){delete checkedSet[uid];}else{checkedSet[uid]=true;}save();}
function save(){var arr=Object.keys(checkedSet);ss(SK,arr);ss(SK+"-levels",levels);}
function getColor(r){return (RARITY[r]||{color:"#fff"}).color;}
function updateStats(){
  var total=ALL_SPRITES.length;
  var found=Object.keys(checkedSet).length;
  var mastered=0;
  for(var _k in checkedSet){if((levels[_k]||0)===5)mastered++;}
  document.getElementById("fc").textContent=found;
  document.getElementById("tc").textContent=total;
  document.getElementById("rc").textContent=total-found;
  document.getElementById("mc").textContent=mastered;
  document.getElementById("mr").textContent=found-mastered;
  document.getElementById("pf").style.width=(total>0?(found/total*100):0)+"%";
}
function buildFilters(){
  var rs=["All","Rare","Epic","Legendary","Mythic"];
  var rfEl=document.getElementById("rf");
  rfEl.innerHTML="";
  for(var i=0;i<rs.length;i++){
    (function(r){
      var b=document.createElement("button");
      b.className="fb";
      b.textContent=r;
      if(rarityFilter===r){b.style.borderColor=r==="All"?"#fff":getColor(r);b.style.color=r==="All"?"#fff":getColor(r);b.style.background=r==="All"?"rgba(255,255,255,.15)":(getColor(r)+"33");}
      b.onclick=function(){rarityFilter=r;render();};
      rfEl.appendChild(b);
    })(rs[i]);
  }
  var sfEl=document.getElementById("sf");
  sfEl.innerHTML="";
  var b1=document.createElement("button");
  b1.className="fb";
  b1.textContent="Missing";
  if(showUnchecked){b1.style.borderColor="#F48FB1";b1.style.color="#F48FB1";b1.style.background="rgba(244,143,177,.2)";}
  b1.onclick=function(){showUnchecked=!showUnchecked;render();};
  sfEl.appendChild(b1);
  var b3=document.createElement("button");
  b3.className="fb";
  b3.textContent="Owned";
  if(showOwned){b3.style.borderColor="#F48FB1";b3.style.color="#F48FB1";b3.style.background="rgba(244,143,177,.2)";}
  b3.onclick=function(){showOwned=!showOwned;render();};
  sfEl.appendChild(b3);
  var b2=document.createElement("button");
  b2.className="fb";
  b2.textContent="Not Mastered";
  if(showNotMax){b2.style.borderColor="#F48FB1";b2.style.color="#F48FB1";b2.style.background="rgba(244,143,177,.2)";}
  b2.onclick=function(){showNotMax=!showNotMax;render();};
  sfEl.appendChild(b2);
  var b4=document.createElement("button");
  b4.className="fb";
  b4.textContent="Mastered";
  if(showMastered){b4.style.borderColor="#F48FB1";b4.style.color="#F48FB1";b4.style.background="rgba(244,143,177,.2)";}
  b4.onclick=function(){showMastered=!showMastered;render();};
  sfEl.appendChild(b4);
  var vfEl=document.getElementById("vf");
  vfEl.innerHTML="";
  var vs=["All","Base","Gold","Gummy","Galaxy"];
  for(var i=0;i<vs.length;i++){
    (function(v){
      var vd=null;
      for(var k=0;k<VARIANTS.length;k++){if(VARIANTS[k].label===v)vd=VARIANTS[k];}
      var b=document.createElement("button");
      b.className="fb";
      b.textContent=(vd?vd.icon+" ":"")+v;
      if(variantFilter===v&&vd){b.style.borderColor=vd.color;b.style.color=vd.color;b.style.background=vd.color+"33";}
      if(variantFilter===v&&!vd){b.style.borderColor="#fff";b.style.color="#fff";b.style.background="rgba(255,255,255,.15)";}
      b.onclick=function(){variantFilter=v;render();};
      vfEl.appendChild(b);
    })(vs[i]);
  }
  var vbonus=document.getElementById("vbonus");
  var activeVariant=null;
  for(var k=0;k<VARIANTS.length;k++){if(VARIANTS[k].label===variantFilter)activeVariant=VARIANTS[k];}
  if(activeVariant&&activeVariant.bonus&&variantFilter!=="Base"){
    vbonus.textContent=activeVariant.icon+" "+activeVariant.bonus;
    vbonus.style.display="block";
    vbonus.style.color=activeVariant.color;
  } else {
    vbonus.style.display="none";
  }
}
function makeLevelRow(uid,rc,crown){
  var wrap=document.createElement("div");
  wrap.className="lr";
  wrap.onclick=function(e){e.stopPropagation();};
  var slider=document.createElement("input");
  slider.type="range";
  slider.min="0";
  slider.max="5";
  slider.value=levels[uid]||0;
  slider.className="ls";
  slider.style.background=buildSliderBg(slider.value,rc);
  slider.style.setProperty("--thumb-color",rc);
  var lv=document.createElement("div");
  lv.className="lv";
  lv.style.color=rc;
  lv.textContent=(levels[uid]||0)>0?"Level "+(levels[uid]||0):"";
  slider.oninput=function(e){
    e.stopPropagation();
    levels[uid]=parseInt(this.value);
    save();
    this.style.background=buildSliderBg(this.value,rc);
    lv.textContent=this.value>0?"Level "+this.value:"";
    if(crown)crown.style.display=(parseInt(this.value)===5?"block":"none");
    updateStats();
  };
  wrap.appendChild(slider);
  wrap.appendChild(lv);
  return wrap;
}
function buildSliderBg(val,rc){
  var pct=(val/5)*100;
  return "linear-gradient(to right,"+rc+" 0%,"+rc+" "+pct+"%,rgba(255,255,255,.15) "+pct+"%,rgba(255,255,255,.15) 100%)";
}
function makeCard(s,rc){
  var isSpecial=s.variantKey==="gold"||s.variantKey==="gummy"||s.variantKey==="galaxy";
  var card=document.createElement("div");
  card.className="vc";
  card.style.borderColor=isChecked(s.uid)?rc+"99":"rgba(255,255,255,.2)";
  if(isChecked(s.uid))card.style.background="rgba(244,143,177,.15)";
  var ck=document.createElement("span");
  ck.className="ck";
  ck.textContent="\u2713";
  ck.style.display=isChecked(s.uid)?"block":"none";
  card.appendChild(ck);
  var crown=document.createElement("span");
  crown.style.cssText="position:absolute;top:3px;left:5px;font-size:11px;line-height:1;display:"+(levels[s.uid]===5?"block":"none")+";z-index:2;";
  crown.textContent="\uD83D\uDC51";
  card.appendChild(crown);
  var imgSrc=SPRITE_IMGS[s.uid];
  if(imgSrc){var img=document.createElement("img");img.referrerPolicy="no-referrer";img.src=imgSrc;img.alt=s.name||"";card.appendChild(img);}
  var bv=VARIANTS[0];
  var lbl=document.createElement("div");
  lbl.className="vl";
  lbl.style.color=s.variantColor||bv.color;
  lbl.textContent=(s.variantIcon||bv.icon)+" "+(s.variantLabel||bv.label);
  card.appendChild(lbl);
  if(s.drop){
    var dropEl=document.createElement("div");
    dropEl.style.cssText="font-size:8px;color:rgba(255,255,255,.45);line-height:1;margin-top:1px;";
    dropEl.textContent=s.drop;
    card.appendChild(dropEl);
  }
  var levelRow=makeLevelRow(s.uid,rc,crown);
  levelRow.style.display=isChecked(s.uid)?"flex":"none";
  card.appendChild(levelRow);
  card.onclick=function(){
    toggleCheck(s.uid);
    updateStats();
    levelRow.style.display=isChecked(s.uid)?"flex":"none";
    crown.style.display=(isChecked(s.uid)&&levels[s.uid]===5)?"block":"none";
    card.style.borderColor=isChecked(s.uid)?rc+"99":"rgba(255,255,255,.2)";
    card.style.background=isChecked(s.uid)?"rgba(244,143,177,.15)":"rgba(255,255,255,.04)";
    ck.style.display=isChecked(s.uid)?"block":"none";
  };
  return card;
}
function render(){
  buildFilters();
  updateStats();
  var content=document.getElementById("content");
  content.innerHTML="";
  var groups=rarityFilter==="All"?["Rare","Epic","Legendary","Mythic"]:[rarityFilter];
  for(var gi=0;gi<groups.length;gi++){
    var rarity=groups[gi];
    var rc=getColor(rarity);
    var visible=[];
    for(var vi=0;vi<ALL_SPRITES.length;vi++){
      var s=ALL_SPRITES[vi];
      if(s.rarity!==rarity)continue;
      if(variantFilter!=="All"&&s.variantLabel!==variantFilter&&!(s.noVariants&&variantFilter==="Base"))continue;
      if(searchQuery){
        var words=searchQuery.toLowerCase().split(/\s+/).filter(function(w){return w.length>0;});
        var searchStr=(s.name+" "+(s.variantLabel||"")+" "+(s.rarity||"")+" "+(s.variantKey==="base"?"base":s.variantKey==="gold"?"gold special":s.variantKey==="gummy"?"gummy special":s.variantKey==="galaxy"?"galaxy special":"")).toLowerCase();
        var allMatch=true;
        for(var wi=0;wi<words.length;wi++){if(searchStr.indexOf(words[wi])===-1){allMatch=false;break;}}
        if(!allMatch)continue;
      }
      if(showUnchecked||showNotMax||showOwned||showMastered){
        var passUnchecked=showUnchecked&&!isChecked(s.uid);
        var passNotMax=showNotMax&&isChecked(s.uid)&&(levels[s.uid]||0)<5;
        var passOwned=showOwned&&isChecked(s.uid);
        var passMastered=showMastered&&isChecked(s.uid)&&(levels[s.uid]||0)===5;
        if(!passUnchecked&&!passNotMax&&!passOwned&&!passMastered)continue;
      }
      visible.push(s);
    }
    if(visible.length===0)continue;
    var sec=document.createElement("div");
    sec.style.marginBottom="28px";
    var hdr=document.createElement("div");
    hdr.className="rh";
    hdr.style.borderBottom="1px solid "+rc+"44";
    var rl=document.createElement("span");
    rl.className="rl";
    rl.style.color=rc;
    rl.textContent=rarity;
    var cnt=document.createElement("span");
    cnt.style.fontSize="11px";cnt.style.color="#888";
    var rch=0;
    for(var vi=0;vi<ALL_SPRITES.length;vi++){if(ALL_SPRITES[vi].rarity===rarity&&isChecked(ALL_SPRITES[vi].uid))rch++;}
    var rtotal=0;
    for(var vi=0;vi<ALL_SPRITES.length;vi++){if(ALL_SPRITES[vi].rarity===rarity)rtotal++;}
    cnt.textContent=rch+"/"+rtotal;
    hdr.appendChild(rl);hdr.appendChild(cnt);sec.appendChild(hdr);
    for(var bi=0;bi<SPRITES_BASE.length;bi++){
      var sprite=SPRITES_BASE[bi];
      if(sprite.rarity!==rarity)continue;
      var svariants=[];
      for(var vi=0;vi<visible.length;vi++){if(visible[vi].spriteId===sprite.id)svariants.push(visible[vi]);}
      if(svariants.length===0)continue;
      var ss2=document.createElement("div");
      ss2.className="ss";
      var sn=document.createElement("div");
      sn.className="sn";
      sn.style.color=rc;
      sn.innerHTML=sprite.name+'<span class="sa">'+sprite.ability+"</span>";
      ss2.appendChild(sn);
      if(sprite.noVariants){
        var bpw=document.createElement("div");
        bpw.className="bpw";
        bpw.appendChild(makeCard(svariants[0],rc));
        ss2.appendChild(bpw);
      } else {
        var grid=document.createElement("div");
        grid.className="vg";
        for(var vi=0;vi<svariants.length;vi++){grid.appendChild(makeCard(svariants[vi],rc));}
        ss2.appendChild(grid);
      }
      sec.appendChild(ss2);
    }
    content.appendChild(sec);
  }
}
try{render();}catch(e){
  var errDiv=document.createElement("div");
  errDiv.style.cssText="text-align:center;padding:40px 20px;color:#F48FB1;";
  errDiv.innerHTML='<div style="font-size:14px;margin-bottom:12px;">\u26a0\ufe0f Failed to load sprites.</div><button onclick="localStorage.removeItem(\''+SK+'\');localStorage.removeItem(\''+SK+'-levels\');location.reload();" style="background:rgba(244,143,177,.2);border:1.5px solid #F48FB1;border-radius:20px;color:#F48FB1;font-size:12px;padding:8px 20px;cursor:pointer;">Clear saved data &amp; reload</button>';
  document.getElementById("content").appendChild(errDiv);
}
var searchInput=document.getElementById("search-input");
searchInput.value=searchQuery;
searchInput.oninput=function(){searchQuery=this.value;render();document.getElementById("search-input").focus();};
</script>
</body>
