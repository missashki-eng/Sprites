  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sprite Checklist">
  <title>Fortnite Sprite Checklist</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:linear-gradient(160deg,#2d1b2e 0%,#3d1a35 40%,#1e1230 100%);min-height:100vh;font-family:-apple-system,system-ui,sans-serif;color:#fff;padding-bottom:60px}
    #app{max-width:480px;margin:0 auto;position:relative}
    button{font-family:inherit}
    #hdr{background:#1e0a22;border-bottom:2px solid rgba(244,143,177,.33);padding:14px 16px 10px;position:sticky;top:0;z-index:20;max-width:480px;margin:0 auto}
    #hdr h1{text-align:center;font-size:10px;letter-spacing:4px;color:#F48FB1;text-transform:uppercase;margin-bottom:2px}
    #hdr h2{text-align:center;font-size:20px;font-weight:900;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#F48FB1,#CE93D8,#F06292);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    #stats{display:flex;justify-content:center;gap:16px;font-size:12px;margin-top:6px}
    #pb{background:rgba(255,255,255,.1);border-radius:10px;height:6px;margin:8px auto 0;max-width:280px}
    #pf{height:100%;border-radius:10px;background:linear-gradient(90deg,#F48FB1,#CE93D8,#F06292);transition:width .3s;width:0%}
    .fr{display:flex;gap:3px;margin-top:4px;margin-bottom:4px;flex-wrap:wrap;justify-content:center;padding:0 8px}
    .fb{padding:2px 5px;border-radius:20px;font-size:7.5px;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,.15);background:transparent;color:#888;cursor:pointer;white-space:nowrap}
    #content{padding:16px 12px 0}
    .rh{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px}
    .rl{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
    .ss{margin-bottom:20px}
    .sn{font-size:13px;font-weight:700;margin-bottom:6px;padding-left:2px}
    .sa{font-size:10px;color:#888;font-weight:400;margin-left:8px}
    .vg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .vc{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:12px;padding:5px 3px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:border-color .15s;height:115px;justify-content:flex-start;overflow:hidden}
    .vc img{width:56px;height:56px;object-fit:contain;display:block}
    .vl{font-size:9px;font-weight:700;line-height:1}
    .ck{position:absolute;top:4px;right:5px;color:#F48FB1;font-size:13px;font-weight:900;display:none}
    .ls{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;outline:none;cursor:pointer;background:rgba(255,255,255,.15)}
    .lv{font-size:9px;font-weight:800;text-align:center;margin-top:2px}
    #dust-section{padding:12px 12px 0}
    #dust-box{background:rgba(255,255,255,.04);border:1.5px solid rgba(244,143,177,.3);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px}
    #dust-icon{font-size:20px;line-height:1}
    #dust-label{font-size:11px;font-weight:800;letter-spacing:2px;color:#F48FB1;text-transform:uppercase;flex:1}
    #dust-input-wrap{display:flex;align-items:center;gap:6px}
    #dust-input{background:rgba(244,143,177,.15);border:1.5px solid rgba(244,143,177,.4);border-radius:10px;color:#fff;font-size:18px;font-weight:800;padding:4px 10px;width:130px;text-align:right;-webkit-appearance:none;outline:none}
    #dust-input::placeholder{color:rgba(255,255,255,.3)}
    .bpw{display:flex;justify-content:center}
    .bpw .vc{width:calc(25% - 5px)}
    .ls::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:var(--thumb-color,#F48FB1);cursor:pointer}
    .lr{width:100%;margin-top:4px;padding:0 2px;display:flex;flex-direction:column;gap:2px}
    .ls{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;cursor:pointer;display:block}
    .ls::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:var(--thumb-color,#F48FB1);cursor:pointer}
    .lv{font-size:9px;font-weight:800;text-align:center;margin-top:1px}
    #share-btn{position:fixed;bottom:24px;right:16px;z-index:100;background:linear-gradient(135deg,#F48FB1,#CE93D8);border:none;border-radius:50px;color:#fff;font-size:12px;font-weight:800;padding:10px 18px;cursor:pointer;box-shadow:0 4px 20px rgba(244,143,177,.5);letter-spacing:.5px;}
    #share-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);align-items:center;justify-content:center;flex-direction:column;gap:16px;}
    #share-overlay.active{display:flex;}
    #share-canvas{max-width:92vw;max-height:75vh;border-radius:16px;}
    #share-actions{display:flex;gap:12px;}
    #share-actions button{background:rgba(244,143,177,.2);border:1.5px solid #F48FB1;border-radius:20px;color:#F48FB1;font-size:13px;font-weight:700;padding:10px 22px;cursor:pointer;}
  </style>
</head>

      try{
        var iw=90,ih=90;
        ctx.drawImage(img, x+(cellW-iw)/2, y+14, iw, ih);
      }catch(e){}
    }

    // Name
    ctx.fillStyle=s.color||rc;
    ctx.font="bold 11px -apple-system,sans-serif";
    ctx.textAlign="center";
    var name=s.name.replace(" Sprite","").replace("The ","");
    ctx.fillText(name, x+cellW/2, y+116);

    // Variant
    if(s.variantLabel){
      ctx.fillStyle=s.variantColor||"#fff";
      ctx.font="bold 10px -apple-system,sans-serif";
      ctx.fillText((s.variantIcon||"")+" "+s.variantLabel, x+cellW/2, y+132);
    }
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  // Footer
  function drawFooter(){
    ctx.fillStyle="rgba(244,143,177,0.5)";
    ctx.font="10px -apple-system,sans-serif";
    ctx.textAlign="center";
    ctx.fillText("Generated by Sprite Checklist", W/2, H-14);
  }

  // Load all images then draw
  var toLoad=missing.length;
  var imgs={};
  function tryDraw(){
    drawn++;
    if(drawn>=toLoad){
      for(var i=0;i<missing.length;i++){
        var col=i%cols, row=Math.floor(i/cols);
        drawCell(missing[i], col, row, imgs[missing[i].uid]||null);
      }
      drawFooter();
      document.getElementById("share-overlay").classList.add("active");
    }
  }

  for(var i=0;i<missing.length;i++){
    (function(s){
      var imgUrl=SPRITE_IMGS[s.uid];
      if(!imgUrl){tryDraw();return;}
      var im=new Image();
      im.crossOrigin="anonymous";
      im.onload=function(){imgs[s.uid]=im;tryDraw();};
      im.onerror=function(){tryDraw();};
      im.src=imgUrl;
    })(missing[i]);
  }
}

function recoverData(){
  var oldKey="fortnite-sprite-checklist-v4";
  var newKey="fortnite-sprite-checklist-v4-ch7s3";
  var old=localStorage.getItem(oldKey);
  if(old){
    localStorage.setItem(newKey,old);
    var oldL=localStorage.getItem(oldKey+"-levels");
    if(oldL)localStorage.setItem(newKey+"-levels",oldL);
    alert("Data restored! Reloading...");
    location.reload();
  } else {
    alert("No old save data found under the original key. It may have already been migrated or cleared.");
  }
}
function saveShareImage(){
  var canvas=document.getElementById("share-canvas");
  var a=document.createElement("a");
  a.download="sprites-i-need.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
}
</script>
